<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Arthur Vieira — Full-Stack Developer">
<defs>
  <clipPath id="card"><rect width="1200" height="400" rx="24"/></clipPath>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060A13"/><stop offset="1" stop-color="#0B1324"/></linearGradient>
  <radialGradient id="o1"><stop offset="0" stop-color="#2563EB" stop-opacity=".55"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
  <radialGradient id="o2"><stop offset="0" stop-color="#7C3AED" stop-opacity=".38"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  <radialGradient id="o3"><stop offset="0" stop-color="#06B6D4" stop-opacity=".30"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
  <radialGradient id="sphere" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#1E40AF" stop-opacity=".55"/><stop offset=".6" stop-color="#0B1324" stop-opacity=".85"/><stop offset="1" stop-color="#060A13" stop-opacity=".95"/></radialGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#93C5FD" stop-opacity=".7"/><stop offset=".5" stop-color="#93C5FD" stop-opacity=".05"/><stop offset="1" stop-color="#A78BFA" stop-opacity=".4"/></linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#BFDBFE"/></linearGradient>
  <radialGradient id="fade" cx=".75" cy=".5" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="dotsMask"><rect width="1200" height="400" fill="url(#fade)"/></mask>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#94A3B8"/></pattern>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .orb{animation:drift 22s ease-in-out infinite alternate}
  .orb.b{animation-duration:28s;animation-direction:alternate-reverse}
  .orb.c{animation-duration:18s}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(60px,30px)}}
  .float{animation:float 7s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(-5px)}50%{transform:translateY(5px)}}
  .mer{fill:none;stroke:#93C5FD;stroke-opacity:.32;stroke-width:1}
  .lat{fill:none;stroke:#93C5FD;stroke-opacity:.18;stroke-width:1}
  .orbit{fill:none;stroke:#BFDBFE;stroke-opacity:.45;stroke-width:1.2}
  .orbit.back{stroke-opacity:.12}
  .up{opacity:0;animation:up 1.1s cubic-bezier(.22,1,.36,1) forwards}
  .d1{animation-delay:.15s} .d2{animation-delay:.35s} .d3{animation-delay:.6s} .d4{animation-delay:.85s}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .label{font:500 15px 'JetBrains Mono','SF Mono','Cascadia Code',Consolas,monospace;fill:#60A5FA;letter-spacing:.12em}
  .name{font:700 68px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:url(#name);letter-spacing:-.02em}
  .tag{font:400 21px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#CBD5E1;opacity:0;animation:tag 16s ease-in-out infinite}
  @keyframes tag{0%{opacity:0;transform:translateY(8px)}4%,21%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-8px)}}
  .meta{font:500 14px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#94A3B8}
  .chip{fill:#0F1B33;stroke:#1E3A8A;stroke-opacity:.6}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  @media (prefers-reduced-motion: reduce){.tag:first-of-type{opacity:1}.up{opacity:1}}
</style>
<g clip-path="url(#card)">
  <rect width="1200" height="400" fill="url(#bg)"/>
  <circle class="orb" cx="880" cy="120" r="320" fill="url(#o1)"/>
  <circle class="orb b" cx="1080" cy="380" r="300" fill="url(#o2)"/>
  <circle class="orb c" cx="160" cy="420" r="260" fill="url(#o3)"/>
  <rect width="1200" height="400" fill="url(#dots)" opacity=".18" mask="url(#dotsMask)"/>
  
  <g transform="translate(910 200)"><g class="float"><g transform="rotate(-16)">
    <path d="M182.9 0 A182.9 42.48 0 0 0 -182.9 0" class="orbit back"/>
    <circle r="118" fill="url(#sphere)"/>
    <ellipse cx="0" cy="-102.2" rx="59.0" ry="8.3" class="lat"/><ellipse cx="0" cy="-59.0" rx="102.2" ry="14.3" class="lat"/><ellipse cx="0" cy="0.0" rx="118.0" ry="16.5" class="lat"/><ellipse cx="0" cy="59.0" rx="102.2" ry="14.3" class="lat"/><ellipse cx="0" cy="102.2" rx="59.0" ry="8.3" class="lat"/>
    <ellipse cx="0" cy="0" rx="118" ry="118" class="mer"><animate attributeName="rx" values="118;0;118" keyTimes="0;0.5;1" dur="24s" begin="0.00s" repeatCount="indefinite" calcMode="spline" keySplines="0.12 0 0.39 0;0.61 1 0.88 1"/></ellipse><ellipse cx="0" cy="0" rx="118" ry="118" class="mer"><animate attributeName="rx" values="118;0;118" keyTimes="0;0.5;1" dur="24s" begin="-4.00s" repeatCount="indefinite" calcMode="spline" keySplines="0.12 0 0.39 0;0.61 1 0.88 1"/></ellipse><ellipse cx="0" cy="0" rx="118" ry="118" class="mer"><animate attributeName="rx" values="118;0;118" keyTimes="0;0.5;1" dur="24s" begin="-8.00s" repeatCount="indefinite" calcMode="spline" keySplines="0.12 0 0.39 0;0.61 1 0.88 1"/></ellipse><ellipse cx="0" cy="0" rx="118" ry="118" class="mer"><animate attributeName="rx" values="118;0;118" keyTimes="0;0.5;1" dur="24s" begin="-12.00s" repeatCount="indefinite" calcMode="spline" keySplines="0.12 0 0.39 0;0.61 1 0.88 1"/></ellipse><ellipse cx="0" cy="0" rx="118" ry="118" class="mer"><animate attributeName="rx" values="118;0;118" keyTimes="0;0.5;1" dur="24s" begin="-16.00s" repeatCount="indefinite" calcMode="spline" keySplines="0.12 0 0.39 0;0.61 1 0.88 1"/></ellipse><ellipse cx="0" cy="0" rx="118" ry="118" class="mer"><animate attributeName="rx" values="118;0;118" keyTimes="0;0.5;1" dur="24s" begin="-20.00s" repeatCount="indefinite" calcMode="spline" keySplines="0.12 0 0.39 0;0.61 1 0.88 1"/></ellipse>
    <circle r="118" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
    <path d="M-182.9 0 A182.9 42.48 0 0 0 182.9 0" class="orbit"/>
    <circle r="4.5" fill="#E0F2FE" filter="url(#glow)">
      <animateMotion dur="14s" repeatCount="indefinite" path="M-182.9 0 A182.9 42.48 0 0 0 182.9 0 A182.9 42.48 0 0 0 -182.9 0"/>
      <animate attributeName="opacity" values="0.2;1;1;0.2;0.2" keyTimes="0;0.06;0.44;0.56;1" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g></g></g>
  <g transform="translate(80 0)">
    <text x="0" y="128" class="label up d1">// FULL-STACK DEVELOPER</text>
    <text x="-3" y="205" class="name up d2">Arthur Vieira</text>
    <g transform="translate(0 252)"><g class="up d3"><text x="0" y="0" class="tag" style="animation-delay:0s">APIs e sistemas web com Node, TypeScript e React</text><text x="0" y="0" class="tag" style="animation-delay:4s">Integrações com SAP Business One e SAP HANA</text><text x="0" y="0" class="tag" style="animation-delay:8s">Automação de processos com n8n e Docker</text><text x="0" y="0" class="tag" style="animation-delay:12s">Ciência de dados, machine learning e agentes de IA</text></g></g>
    <g transform="translate(0 292)"><g class="up d4">
      <rect width="196" height="34" rx="17" class="chip"/>
      <circle cx="18" cy="17" r="4" fill="#34D399"><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="32" y="22" class="meta">Joinville, SC · Brasil</text>
      <rect x="208" width="176" height="34" rx="17" class="chip"/>
      <text x="228" y="22" class="meta">Copapel · Full-Stack</text>
    </g></g>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="23.5" fill="none" stroke="#1E293B"/>
</g>
</svg>